[workspace]
members = [
    "qhal",
    "key_pool",
    "otp_engine",
    "auth",
    "tools",
    "uhf",
    "wc_auth",
    "kernel",
    "kernel/scheduler",
    "kernel/memory",
    "kernel/ipc",
    "kernel/syscall",
    "kernel/drivers_core",
    "qtor",
    "qonion",
    "amnesia",
    "usb_boot",
]
resolver = "2"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }

